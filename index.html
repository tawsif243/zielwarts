<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zielwärts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zielwärts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a1020;--pn:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eaf1ff;--mu:#8a97b5;--ac:#5eead4;--ok:#34d399;--mn:#fbbf24;--sk:#fb7185;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:radial-gradient(120% 55% at 50% 0,#1a2552,#0a1020 62%) #0a1020;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:440px;padding:14px 16px 96px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:13px}.h2{font-size:18px;font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}.h2 a{font-size:13px;color:#7dd3fc;font-weight:500}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd b{font-size:20px;display:block}.hd .pf{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--pn);border:1px solid var(--bd);display:grid;place-items:center}
.wk{display:flex;align-items:center;gap:4px;margin-bottom:14px}.wk .ar{width:30px;height:56px;border-radius:12px;background:var(--pn);border:1px solid var(--bd);font-size:20px}
.dy{flex:1;text-align:center;font-size:11px;color:var(--mu)}.dy span{position:relative;display:grid;place-items:center;width:36px;height:36px;margin:4px auto 0;border-radius:50%;background:#1c2644;color:var(--tx);font-size:15px;font-weight:700}
.dy span.on{background:#2dd4bf;color:#06201c}.dy span.td:not(.on){outline:1px solid var(--ac)}.dy i{position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.dt{color:var(--mu);font-size:15px}.tt{font-size:26px;font-weight:800;margin:2px 0 14px;font-family:Georgia,serif}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;height:150px;margin-bottom:14px;background:linear-gradient(180deg,#22336e,#b5573a 75%,#f6a94c)}
.hero:before{content:"";position:absolute;right:26px;bottom:40px;width:38px;height:38px;border-radius:50%;background:#ffd27a;box-shadow:0 0 30px #ffb347}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:#0e1a33;clip-path:polygon(0 100%,0 55%,18% 28%,32% 52%,50% 12%,68% 50%,82% 26%,100% 55%,100% 100%)}
.hero>*{position:relative;z-index:1}.hero b{font-size:22px;display:block}.hero p{margin:6px 0 0;font-size:13px;max-width:200px;opacity:.9}
.tl{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px}
.row{display:flex;align-items:center;gap:12px}
.ring{position:relative;display:grid;place-items:center}.ring>div{position:absolute;text-align:center}
.nx{border-color:#38bdf8;box-shadow:0 0 22px -6px #38bdf8}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:700;background:linear-gradient(90deg,#38bdf8,#818cf8);color:#06142b;margin-top:12px}
.ch{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.cw{width:64px;flex:none;text-align:center;font-size:11px}.cw .tl{margin:0 auto 6px;background:var(--pn)}.cw em{font-style:normal;display:block}
.it{display:flex;align-items:center;gap:10px;margin-bottom:8px}.it .no{width:26px;height:26px;border-radius:50%;flex:none;background:#1c2644;display:grid;place-items:center;font-size:12px}
.it .pn{flex:1;margin:0;padding:10px;display:flex;align-items:center;gap:12px}.it .tl{width:42px;height:42px;font-size:20px}.it.cur .pn{border-color:var(--ac);box-shadow:0 0 18px -4px var(--ac)}
.ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:12px;flex:none}
.tabs{display:flex;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:4px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border-radius:12px;font-size:14px;color:var(--mu)}.tabs .on{background:linear-gradient(90deg,#2563eb,#4f7be8);color:#fff}
.sr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.sr:last-child{border:0}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.pl{display:flex;gap:8px;margin-bottom:14px}.pl div{flex:1;border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--bd);background:var(--pn)}.pl b{font-size:20px;display:block}
input,select{width:100%;font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;padding:13px;margin:6px 0 14px}select option{color:#000}
label{font-size:14px;font-weight:600}.sw{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sw input{width:46px;height:26px;margin:0;accent-color:#4f7be8}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#0b1328;border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:100px;font-size:11px;color:var(--mu);padding:5px}nav button.on{color:#7dd3fc}nav span{display:block;font-size:20px}
.ov{position:fixed;inset:0;z-index:10;background:linear-gradient(#0d1633,#0a1020);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;max-width:440px;margin:auto}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--pn);margin-bottom:10px;width:100%;text-align:left}.opt .tl{width:38px;height:38px;border-radius:50%;font-size:18px}
.cg{position:fixed;inset:0;z-index:20;background:rgba(5,8,20,.88);display:grid;place-items:center;padding:20px;overflow:hidden}
.cd{background:#121c3b;border:1px solid var(--ac);border-radius:26px;padding:26px 22px;text-align:center;width:100%;max-width:360px;box-shadow:0 0 50px -10px var(--ac);animation:pop .4s}
@keyframes pop{from{transform:scale(.7);opacity:0}}@keyframes fl{to{transform:translateY(-110vh) rotate(40deg)}}
.cf{position:absolute;bottom:-40px;font-size:26px;animation:fl 3s ease-in forwards}
.rw{background:rgba(251,191,36,.12);border:1px dashed var(--mn);border-radius:14px;padding:12px;margin:14px 0;font-size:14px}
#sp{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#16233a,#050b18 70%);display:grid;place-items:center;transition:opacity .45s}
#sp.out{opacity:0;pointer-events:none}#sp img{width:min(78vw,340px);border-radius:26%;box-shadow:0 0 60px -10px #f6c26b;animation:pop .6s ease-out}
</style></head><body>
<div id="sp"><img id="spi" alt="Zielwärts"></div><div id="app"></div><nav id="nav"></nav><div id="ov"></div>

const K="mom_v3",DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.h)S={h:D.map((d,i)=>({id:"d"+i,i:d[0],n:d[1],t:d[2],f:d[3],m:d[4],c:d[5],r:d[6]||"d",u:d[7]||""})),log:{}};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const par=k=>{const a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])};
const T=key(new Date());let tab="home",sel=T,wk=0,pt="ov",det=null,cong=null;
const RP={d:[0,1,2,3,4,5,6],wd:[1,2,3,4,5],we:[0,6],g3:[1,3,6]};
const list=k=>S.h.filter(h=>RP[h.r||"d"].includes(par(k).getDay()));
const L=k=>S.log[k]||{};
const cnt=k=>{const l=L(k),a=list(k),o={done:0,min:0,skip:0,t:a.length};a.forEach(h=>l[h.id]&&o[l[h.id]]++);return o};
const pct=k=>{const c=cnt(k);return c.t?Math.round((c.done+c.min)/c.t*100):0};
const xp=()=>{let x=0;for(const k in S.log)for(const i in S.log[k]){const v=S.log[k][i];x+=v=="done"?10:v=="min"?5:0}return x};
const streak=()=>{let s=0;const d=new Date();for(let i=0;i<400;i++){if(pct(key(d))>=60)s++;else if(i>0)break;d.setDate(d.getDate()-1)}return s};
const best=()=>{const ks=Object.keys(S.log).sort();if(!ks.length)return 0;let b=0,r=0;const d=par(ks[0]),e=par(T);while(d<=e){if(pct(key(d))>=60){r++;b=Math.max(b,r)}else r=0;d.setDate(d.getDate()+1)}return b};
const strength=()=>{let s=0;const d=new Date();for(let i=0;i<7;i++){s+=pct(key(d));d.setDate(d.getDate()-1)}return Math.round(s/7)};
const mf=x=>x>=60?(x/60)+(x==60?" hour":" hours"):x+" minutes";
const dur=h=>h.u||mf(h.f);
const nextH=()=>{const l=L(sel);return list(sel).find(h=>!l[h.id])};
const dlab=k=>par(k).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const ring=(p,s,w)=>{const r=(s-w)/2,c=2*Math.PI*r,m=s/2;return `<svg width="${s}" height="${s}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${w}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#34d399" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${m} ${m})"/></svg>`};
const tile=h=>`<div class="tl" style="background:${CC[h.c]}33">${h.i}</div>`;
const st=(v)=>v=="done"?`<span class="ck" style="background:#34d399;border:0;color:#04251a">✓</span>`:v=="min"?`<span class="ck" style="background:#fbbf24;border:0;color:#2b1d00">!</span>`:v=="skip"?`<span class="ck" style="background:#fb7185;border:0;color:#2b0710">✕</span>`:`<span class="ck"></span>`;
function strip(){const b=new Date();b.setDate(b.getDate()-b.getDay()+wk*7);let o=`<div class="wk"><button class="ar" onclick="wk--;render()">‹</button>`;for(let i=0;i<7;i++){const d=new Date(b);d.setDate(b.getDate()+i);const k=key(d);o+=`<div class="dy" onclick="sel='${k}';render()"><div>${DN[i]}</div><span class="${k==sel?"on":""} ${k==T?"td":""}">${d.getDate()}${k<=T&&pct(k)>=60?"<i></i>":""}</span></div>`}return o+`<button class="ar" onclick="wk++;render()">›</button></div><div class="dt">${dlab(sel)}</div><div class="tt">${sel==T?"Today's Plan":"Day Plan"}</div>`}
function home(){const c=cnt(sel),n=nextH(),hr=new Date().getHours(),g=hr<12?"morning":hr<17?"afternoon":"evening",l=L(sel);
 let o=`<div class="hd"><img src="${LOGO}" alt="" style="width:46px;height:46px;border-radius:12px"><div><b>Zielwärts</b><span class="mu">Kleine Schritte. Große Ziele.</span></div><div class="pf">👤</div></div>${strip()}
 <div class="hero"><b>Good ${g},<br>Tawsif</b><p>Discipline today builds the life you want tomorrow.</p></div>
 <div class="pn row" onclick="pt='dt';go('prog')"><div class="ring">${ring(pct(sel),72,8)}<div style="font-size:11px">${pct(sel)}%</div></div><div><div class="mu">${sel==T?"Today's":"Day"} Progress</div><b style="font-size:20px">${c.done+c.min}/${c.t}</b> <span class="mu">completed</span></div><span style="margin-left:auto;color:var(--ok)">${pct(sel)}% ›</span></div>
 <div class="h2">Next Action</div>`;
 if(!n)o+=`<div class="pn" style="text-align:center"><div style="font-size:44px">🏆</div><b>Chain complete!</b><div class="mu">${c.done} full · ${c.min} minimum · ${c.skip} skipped</div></div>`;
 else o+=`<div class="pn nx"><div class="row" onclick="op('${n.id}')">${tile(n)}<div><b>${n.n}</b><div class="mu">${n.t}</div><div class="mu" style="color:#7dd3fc">⏱ ${dur(n)}${n.m?" · min "+n.m+" min":""}</div></div></div>${sel>T?"":`<button class="bt" onclick="mark('${n.id}','done')">Mark as Done ›</button>`}</div>`;

function chain(){const l=L(sel),n=nextH();return `<div class="hd"><b>My Habit Chain</b></div>${strip()}`+list(sel).map((h,i)=>`<div class="it ${n&&n.id==h.id?"cur":""}" onclick="op('${h.id}')"><div class="no">${i+1}</div><div class="pn">${tile(h)}<div><b style="font-size:15px">${h.n}</b><div class="mu">${h.u||mf(h.f)}</div></div>${n&&n.id==h.id?`<span style="margin-left:auto;color:var(--ac)">›</span>`:st(l[h.id])}</div></div>`).join("")}
function prog(){const c=cnt(sel),p=pct(sel);let o=`<div class="hd"><b style="font-size:26px">Progress</b></div><div class="tabs">${[["ov","Overview"],["dt","Details"],["xs","Stats"]].map(a=>`<button class="${pt==a[0]?"on":""}" onclick="pt='${a[0]}';render()">${a[1]}</button>`).join("")}</div>`;
 if(pt=="ov"){o+=`<div class="ring" style="display:flex;justify-content:center;margin-bottom:16px">${ring(p,200,14)}<div><b style="font-size:38px">${p}%</b><div class="mu">${sel==T?"Today's":"Day"} Completion</div><div>${c.done+c.min} / ${c.t}</div></div></div>
 <div class="pn"><div class="sr"><span style="font-size:22px">🔥</span><div><div class="mu">Current Streak</div><b>${streak()} days</b></div></div><div class="sr"><span style="font-size:22px">👑</span><div><div class="mu">Best Streak</div><b>${best()} days</b></div></div><div class="sr"><span style="font-size:22px">🔗</span><div><div class="mu">Chain Strength</div><b>${strength()}%</b></div></div></div><div class="h2">Habits by Category</div>`;
 const l=L(sel);Object.keys(CC).forEach(k=>{const a=list(sel).filter(h=>h.c==k);if(!a.length)return;const d=a.filter(h=>l[h.id]=="done"||l[h.id]=="min").length;o+=`<div class="pn row" style="padding:12px"><div class="tl" style="background:${CC[k]}33;width:40px;height:40px">${a[0].i}</div><div style="flex:1"><div class="row" style="justify-content:space-between"><span>${k}</span><b>${d} / ${a.length}</b></div><div class="bar"><i style="width:${d/a.length*100}%;background:${CC[k]}"></i></div></div></div>`})}
 if(pt=="dt"){const l=L(sel);o+=`<div class="pn row" style="justify-content:space-between"><button onclick="mv(-1)" style="font-size:22px">‹</button><b>${sel==T?"Today, ":""}${par(sel).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</b><button onclick="mv(1)" style="font-size:22px">›</button></div>
 <div class="ring" style="display:flex;justify-content:center;margin-bottom:14px">${ring(p,150,12)}<div><b style="font-size:28px">${p}%</b><div class="mu">Completion<br>Rate</div></div></div>
 <div class="pl"><div><b style="color:var(--ok)">${c.done}</b>Completed</div><div><b style="color:var(--mn)">${c.min}</b>Minimum</div><div><b style="color:var(--sk)">${c.skip}</b>Skipped</div></div><div class="h2">Chain</div><div class="pn" style="padding:6px 14px">`+list(sel).map(h=>`<div class="sr" onclick="op('${h.id}')">${tile(h)}<div><div>${h.n}</div><div class="mu">${l[h.id]=="done"?"Done":l[h.id]=="min"?"Minimum":l[h.id]=="skip"?"Skipped":"Pending"}</div></div><span style="margin-left:auto">${st(l[h.id])}</span></div>`).join("")+`</div><div class="pn row"><span style="font-size:28px">🌿</span><i class="mu">“Discipline is not a restriction, it's a form of self-respect.”</i></div>`}
 if(pt=="xs"){const x=xp(),b=new Date();b.setDate(b.getDate()-b.getDay()+wk*7);let w="",s=0;for(let i=0;i<7;i++){const d=new Date(b);d.setDate(b.getDate()+i);const q=pct(key(d));s+=q;w+=`<div style="flex:1;text-align:center;font-size:11px" class="mu"><div style="height:90px;display:flex;align-items:flex-end;margin-bottom:4px"><div style="width:100%;height:${Math.max(q,4)}%;border-radius:6px;background:linear-gradient(#5eead4,#34d399)"></div></div>${DN[i]}<br>${q}%</div>`}
 o+=`<div class="pn"><div class="row" style="justify-content:space-between"><b>Weekly Progress</b><span class="mu">avg ${Math.round(s/7)}%</span></div><div style="display:flex;gap:6px;margin-top:12px">${w}</div><div class="row" style="justify-content:center;margin-top:8px"><button onclick="wk--;render()">‹ Prev</button><button onclick="wk++;render()" style="margin-left:20px">Next ›</button></div></div>
 <div class="pn"><div class="mu">Level ${Math.floor(x/100)+1} · ${x} XP</div><div class="bar"><i style="width:${x%100}%;background:linear-gradient(90deg,#fbbf24,#fb923c)"></i></div><div class="mu" style="margin-top:6px">${100-x%100} XP to next level. Full = 10 XP, Minimum = 5 XP.</div></div>`}
 return o}
function build(){return `<div class="hd"><b style="font-size:24px">Chain Builder</b></div><div class="pn row"><div class="tl" style="background:#3b5bdb;font-size:28px">+</div><div><b>Create a New Habit Chain</b><div class="mu">Link your existing habits with new goals.</div></div></div>
 <div class="pn"><label>When (Trigger)</label><select id="bw">${S.h.map((h,i)=>`<option value="${i}">${h.i} After ${h.n}</option>`).join("")}</select>
 <label>I will (Action)</label><input id="bn" placeholder="e.g. Read 5 pages"><label>Emoji</label><input id="bi" value="📖" maxlength="4">
 <label>Time needed (minutes)</label><input id="bf" type="number" value="15"><label>Minimum Version (minutes)</label><input id="bm" type="number" value="5">
 <label>Category</label><select id="bc">${Object.keys(CC).map(k=>`<option>${k}</option>`).join("")}</select>
 <div class="sw"><label>Add to existing chain</label><input id="bx" type="checkbox" checked></div>
 <label>Repeat</label><select id="br"><option value="d">Daily</option><option value="wd">Weekdays</option><option value="we">Weekends</option><option value="g3">Mon · Wed · Sat</option></select></div>
 <button class="bt" onclick="addH()" style="background:linear-gradient(90deg,#38bdf8,#a78bfa)">Save Chain →</button>
 <div class="h2">Remove a habit</div><div class="pn">${S.h.map((h,i)=>`<div class="sr"><span>${h.i} ${h.n}</span><button class="mu" style="margin-left:auto" onclick="del(${i})">Remove</button></div>`).join("")}</div>
 <button class="mu" onclick="if(confirm('Reset all data?')){localStorage.removeItem(K);location.reload()}">Reset everything</button>`}
function addH(){const n=$("bn").value.trim();if(!n)return;const i=+$("bw").value,p=S.h[i],h={id:"c"+Date.now(),i:$("bi").value||"✨",n,t:"After "+p.n,f:+$("bf").value||10,m:+$("bm").value||5,c:$("bc").value,r:$("br").value,u:""};
 if($("bx").checked){S.h.splice(i+1,0,h);const x=S.h[i+2];if(x)x.t="After "+n}else S.h.push(h);sv();go("chain")}
function del(i){if(!confirm("Remove this habit?"))return;const x=S.h[i+1],p=S.h[i-1];if(x&&p)x.t="After "+p.n;S.h.splice(i,1);sv();render()}
function mv(n){const d=par(sel);d.setDate(d.getDate()+n);sel=key(d);render()}
function op(id){const h=S.h.find(x=>x.id==id);det={h:h,ch:L(sel)[id]||"done"};render()}
function mark(id,v){const h=S.h.find(x=>x.id==id),a=xp();(S.log[sel]=S.log[sel]||{})[id]=v;sv();const b=xp();det=null;cong={h:h,v:v,gain:b-a,lv:Math.floor(b/100)>Math.floor(a/100),x:b,nx:nextH()};render()}
function detail(){const h=det.h,o=[["done","Completed",mf(h.f)||"",`<div class="tl" style="background:#34d39966">✓</div>`,"#34d399"],["min","Minimum",h.m?mf(h.m):"Light version",`<div class="tl" style="background:#fbbf2466">!</div>`,"#fbbf24"],["skip","Skipped","Not done",`<div class="tl" style="background:#ffffff1a">✕</div>`,"#8a97b5"]];
 return `<div class="ov"><div class="row" style="justify-content:space-between"><button onclick="det=null;render()" style="font-size:24px">←</button><span class="mu">${dlab(sel)}</span></div>
 <div class="hero" style="height:190px;text-align:center;margin-top:12px"><div class="tl" style="background:#1a2140;width:78px;height:78px;font-size:38px;margin:6px auto 10px;box-shadow:0 0 30px ${CC[h.c]}">${h.i}</div><b style="font-size:22px">${h.n}</b><div style="font-size:14px">⏱ ${dur(h)}</div></div>
 <div class="pn row">${tile({c:"Work",i:"⚡"})}<div><div class="mu">Triggered by</div>${h.t}</div></div><div class="h2">Choose what you did</div>`+o.map(a=>`<button class="opt" style="${det.ch==a[0]?`border-color:${a[4]};background:${a[4]}22`:""}" onclick="det.ch='${a[0]}';render()">${a[3]}<div><b style="color:${det.ch==a[0]?a[4]:"var(--tx)"}">${a[1]}</b><div class="mu">${a[2]}</div></div></button>`).join("")+`<button class="bt" style="margin-top:20px;background:linear-gradient(90deg,#4f7be8,#818cf8);color:#fff" onclick="mark('${h.id}',det.ch)">Save ›</button></div>`}
function congr(){const c=cong,h=c.h,r=c.v=="skip"?"":RW[Math.floor(Math.random()*RW.length)];let cf="";for(let i=0;i<14&&c.v!="skip";i++)cf+=`<span class="cf" style="left:${i*7+2}%;animation-delay:${i*.12}s">${["🎉","✨","⭐","🎊","💫"][i%5]}</span>`;
 const t=c.v=="done"?OK[Math.floor(Math.random()*OK.length)]:c.v=="min"?"Minimum counts! Chain is alive 🔥":"No worries. The chain continues 💪";
 const m=c.v=="done"?`You finished <b>${h.n}</b> (${mf(h.f)}).`:c.v=="min"?`You did the minimum version of <b>${h.n}</b>${h.m?" ("+mf(h.m)+")":""}.`:`Skipping ${h.n} is okay. Keep going from the next step.`;
 const bar=c.x%100;return `<div class="cg" onclick="event.target==this&&(cong=null,render())">${cf}<div class="cd"><div style="font-size:60px">${c.v=="skip"?"🌱":c.v=="min"?"🌟":"🏆"}</div><h2 style="margin:6px 0">${t}</h2><div class="mu">${m}</div>
 ${c.gain?`<div style="margin:14px 0 6px;font-weight:800;color:var(--mn);font-size:20px">+${c.gain} XP</div><div class="bar"><i style="width:${bar}%;background:linear-gradient(90deg,#fbbf24,#fb923c)"></i></div><div class="mu" style="margin-top:4px">${c.lv?"🎖️ Level up! Level "+(Math.floor(c.x/100)+1):"Level "+(Math.floor(c.x/100)+1)+" · "+c.x+" XP"}</div>`:""}
 ${r?`<div class="rw"><b>🎁 Mini reward</b><br>${r}</div>`:""}
 <button class="bt" onclick="cong=null;render()">${c.nx?"Next: "+c.nx.n+" ›":"Finish ›"}</button></div></div>`}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$("app").innerHTML={home,chain,prog,build}[tab]();
 $("nav").innerHTML=[["home","🏠","Home"],["chain","🔗","Chain"],["prog","📊","Progress"],["build","🛠️","Builder"]].map(a=>`<button class="${tab==a[0]?"on":""}" onclick="go('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join("");
 $("ov").innerHTML=(det?detail():"")+(cong?congr():"")}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
